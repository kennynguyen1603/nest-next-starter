services:
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
    command:
      - sh
      - -c
      - |
        if [ "$$DATABASE_TYPE" = "mongodb" ] || [ -z "$$DATABASE_TYPE" ]; then
          node dist/database/seeds/document/run-seed.js
        else
          node dist/database/seeds/relational/run-seed.js
        fi
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: "false"
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_TWITTER_CLIENT_ID: ${NEXT_PUBLIC_TWITTER_CLIENT_ID:-}
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    environment:
      NODE_ENV: production
      API_URL: http://api:8080
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_NOTIFICATIONS_ENABLED: ${NEXT_PUBLIC_NOTIFICATIONS_ENABLED:-false}
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nest-next-starter-prometheus
    restart: unless-stopped
    ports:
      - ${DOCKER_PROMETHEUS_PORT:-9090}:9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    volumes:
      - ./prometheus.config.yml:/etc/prometheus/prometheus.yaml:ro
      - ./.docker/prometheus-data:/prometheus
    profiles:
      - monitoring
    depends_on:
      - setup_prometheus

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: nest-next-starter-grafana
    restart: unless-stopped
    ports:
      - '${DOCKER_GRAFANA_PORT:-3001}:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - ./apps/api/src/tools/grafana/provisioning:/etc/grafana/provisioning
      - ./apps/api/src/tools/grafana/dashboards:/var/lib/grafana/dashboards
      - ./.docker/grafana-data:/var/lib/grafana
    profiles:
      - monitoring
    depends_on:
      - prometheus
      - setup_grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: nest-next-starter-postgres-exporter
    ports:
      - ${DOCKER_PG_EXPORTER:-9187}:9187
    environment:
      DATA_SOURCE_NAME: 'postgresql://${DATABASE_USERNAME:-}:${DATABASE_PASSWORD:-}@${DATABASE_HOST:-localhost}:${DATABASE_PORT:-5432}/${DATABASE_NAME:-nest_next_starter_db}?sslmode=${DATABASE_SSL_MODE:-disable}'
    profiles:
      - monitoring-postgres
    depends_on:
      - prometheus


  # Solution to fix prometheus volume permission issue
  setup_prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nest-next-starter-setup-prometheus
    restart: no
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 65534:65534 /prometheus
    volumes:
      - ./.docker/prometheus-data:/prometheus
    profiles:
      - monitoring

  # Solution to fix grafana volume permission issue
  setup_grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: nest-next-starter-setup-grafana
    restart: no
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 472:472 /var/lib/grafana
    volumes:
      - ./.docker/grafana-data:/var/lib/grafana
    profiles:
      - monitoring

volumes:
  redis_data:
