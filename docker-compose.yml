services:
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/nest_starter
    command: node dist/database/seeds/document/run-seed.js
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispass
      REDIS_TLS: "false"
      DATABASE_URL: mongodb://mongo:27017/nest_starter
      APP_COOKIE_SECURE: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_FACEBOOK_APP_ID: ${NEXT_PUBLIC_FACEBOOK_APP_ID:-}
        NEXT_PUBLIC_GITHUB_CLIENT_ID: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-}
        NEXT_PUBLIC_TWITTER_CLIENT_ID: ${NEXT_PUBLIC_TWITTER_CLIENT_ID:-}
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
      API_URL: http://api:8080
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redispass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nest-next-starter-prometheus
    restart: unless-stopped
    ports:
      - ${DOCKER_PROMETHEUS_PORT:-9090}:9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
    volumes:
      - ./prometheus.config.yml:/etc/prometheus/prometheus.yaml:ro
      - ./.docker/prometheus-data:/prometheus
    profiles:
      - monitoring
    depends_on:
      - setup_prometheus

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: nest-next-starter-grafana
    restart: unless-stopped
    ports:
      - '${DOCKER_GRAFANA_PORT:-3001}:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USERNAME:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./apps/api/src/tools/grafana/provisioning:/etc/grafana/provisioning
      - ./apps/api/src/tools/grafana/dashboards:/var/lib/grafana/dashboards
      - ./.docker/grafana-data:/var/lib/grafana
    profiles:
      - monitoring
    depends_on:
      - prometheus
      - setup_grafana

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: nest-next-starter-postgres-exporter
    ports:
      - ${DOCKER_PG_EXPORTER:-9187}:9187
    environment:
      DATA_SOURCE_NAME: 'postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=${DATABASE_SSL_MODE:-disable}'
    profiles:
      - monitoring-postgres
    depends_on:
      - prometheus

  mongodb-exporter:
    image: percona/mongodb_exporter:0.44
    container_name: nest-next-starter-mongodb-exporter
    restart: unless-stopped
    ports:
      - ${DOCKER_MONGO_EXPORTER:-9216}:9216
    environment:
      MONGODB_URI: 'mongodb://mongo:27017'
    profiles:
      - monitoring
    depends_on:
      - prometheus
      - mongo

  # Solution to fix prometheus volume permission issue
  setup_prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nest-next-starter-setup-prometheus
    restart: no
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 65534:65534 /prometheus
    volumes:
      - ./.docker/prometheus-data:/prometheus
    profiles:
      - monitoring

  # Solution to fix grafana volume permission issue
  setup_grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: nest-next-starter-setup-grafana
    restart: no
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - |
        chown -R 65534:65534 /var/lib/grafana
    volumes:
      - ./.docker/grafana-data:/var/lib/grafana
    profiles:
      - monitoring
volumes:
  mongo_data:
  redis_data:
