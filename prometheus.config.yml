global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: server
    scrape_interval: 15s
    static_configs:
      - targets: ['api:8080']

  - job_name: database
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: mongodb
    scrape_interval: 15s
    static_configs:
      - targets: ['mongodb-exporter:9216']
